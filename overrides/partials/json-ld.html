{#- Schema.org JSON-LD for SEO -#}
{% if page.is_homepage %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ config.site_name | tojson }},
  "description": {{ config.site_description | tojson }},
  "url": {{ config.site_url | tojson }},
  "author": {
    "@type": "Person",
    "name": {{ config.site_author | tojson }}
  }
}
</script>
{% elif page.meta and page.meta.date %}
{% set social_path = page.file.src_path.replace('.md', '.png') %}
{% set social_image = config.site_url ~ '/assets/images/social/' ~ social_path %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ page.title | striptags | tojson }},
  "description": {{ (page.meta.description if page.meta.description else config.site_description) | tojson }},
  "url": {{ page.canonical_url | tojson }},
  "datePublished": {{ page.meta.date.strftime('%Y-%m-%d') | tojson }},
  "author": {
    "@type": "Person",
    "name": {{ (page.meta.author if page.meta.author else config.site_author) | tojson }}
  },
  "publisher": {
    "@type": "Person",
    "name": {{ config.site_author | tojson }}
  },
  "image": {{ social_image | tojson }},
  "isPartOf": {
    "@type": "WebSite",
    "name": {{ config.site_name | tojson }},
    "url": {{ config.site_url | tojson }}
  }
}
</script>
{% endif %}
