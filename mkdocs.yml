site_name: Working Notes on AI Systems
site_description: Systems architecture and AI engineering notes — from production work.
site_url: https://milenageorgieva.tech

copyright: Copyright &copy; 2026 <a href="https://milenageorgieva.tech">Milena Georgieva</a>

repo_url: https://github.com/mimitheone/milenageorgieva.tech
repo_name: GitHub

theme:
  name: material
  language: en
  custom_dir: overrides

  favicon: assets/images/favicon.ico

  font:
    text: IBM Plex Sans
    code: JetBrains Mono

  palette:
    - scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.tracking

    # Search
    - search.suggest
    - search.highlight

    # Content
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - awesome-pages

  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      type: date
      timezone: Europe/Sofia
      locale: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji

  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/contact-form.css

extra_javascript:
  - javascripts/nav-accordion.js

nav:
  - Notes:
      - Introduction: index.md
      - Large Language Models: llm/index.md
      - Retrieval-Augmented Generation: rag/index.md
      - AI Agents: agents/index.md
      - Prompt Engineering: prompt-engineering/index.md
      - Vector Databases: vector-databases/index.md
      - Systems Architecture: ai-architecture/index.md
      - Machine Learning: machine-learning/index.md
      - Time Series: time-series/index.md
      - Frameworks: frameworks/index.md
      - AI Act: ai-act/index.md

  - Contact: contact.md
  - Bio: bio.md
