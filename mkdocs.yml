site_name: Working Notes on AI Systems
site_description: Systems architecture and AI engineering notes — from production work.
site_url: https://milenageorgieva.tech

copyright: Copyright &copy; 2026 <a href="https://milenageorgieva.tech">Milena Georgieva</a>

repo_url: https://github.com/mimitheone/milenageorgieva.tech
repo_name: GitHub

theme:
  name: material
  language: en
  custom_dir: overrides

  favicon: assets/images/favicon.ico

  font:
    text: IBM Plex Sans
    code: JetBrains Mono

  palette:
    - scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.tracking

    # Search
    - search.suggest
    - search.highlight

    # Content
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - awesome-pages

  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      type: date
      timezone: Europe/Sofia
      locale: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji

  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/contact-form.css

extra_javascript:
  - javascripts/nav-accordion.js

nav:
  - Notes:
      - Introduction: index.md
      - Large Language Models:
          - Overview: llm/index.md
          - Cost Predictability: llm/llm-cost-predictability.md
          - LLM Cost Optimization: llm/llm-cost-optimization.md
      - AI Agents:
          - Overview: agents/index.md
          - Darwin Gödel Machine: agents/darwin-godel-machine.md
          - What Is an Agent?: agents/what-is-an-agent.md
          - Fallback Architecture: agents/fallback-architecture.md
          - Core Design Principles: agents/core-design-principles.md
          - Agent Definition Template: agents/agent-definition-template.md
          - Agent-to-Agent Protocol: agents/agent-to-agent-protocol.md
          - Agent Communication Patterns: agents/agent-communication-patterns.md
          - Dependency Inversion Principle: agents/dependency-inversion-principle.md
          - Designing an Agent: agents/designing-an-agent.md
          - Self-Improving Agents: agents/self-improving-agents.md
      - Systems Architecture:
          - Overview: ai-architecture/index.md
          - Single Responsibility Principle: ai-architecture/single-responsibility-principle.md
          - Agent Contracts: ai-architecture/agent-contracts.md
          - Interface Segregation Principle: ai-architecture/interface-segregation-principle.md
          - Components and Skills: ai-architecture/components-and-skills.md
          - Reuse/Release Equivalence Principle: ai-architecture/reuse-release-equivalence-principle.md
          - Acyclic Dependency Principle: ai-architecture/acyclic-dependency-principle.md
          - Stable Dependencies Principle: ai-architecture/stable-dependencies-principle.md
          - The Architecture of AI Systems: ai-architecture/ai-systems-architecture.md
      - Machine Learning:
          - Overview: machine-learning/index.md
          - Overfitting in Business: machine-learning/overfitting-in-business.md
          - Clustering: machine-learning/clustering.md
          - K-Nearest Neighbors: machine-learning/knn.md
          - SHAP: machine-learning/shap.md
          - ML Algorithms: machine-learning/ml-algorithms.md
      - Guardrails:
          - Overview: guardrails/index.md
          - Prompt Injection: guardrails/prompt-injection.md
          - AI Guardrails: guardrails/ai-guardrails.md
          - Relevance Control: guardrails/relevance-control.md
          - Tool Access Control: guardrails/tool-access-control.md
          - Rule-Based Filters: guardrails/rule-based-filters.md
          - PII Protection: guardrails/pii-protection.md
          - Secure RAG: guardrails/secure-rag.md
          - Safety Enforcement: guardrails/safety-enforcement.md
      - AI Act:
          - Overview: ai-act/index.md
          - High-Risk AI Systems: ai-act/high-risk-ai-systems.md
          - Human-in-the-Loop: ai-act/human-in-the-loop.md
          - Risk Management: ai-act/risk-management.md
          - Bias & Fairness Controls: ai-act/bias-and-fairness-controls.md
          - Logging & Auditability: ai-act/logging-and-auditability.md
          - Monitoring & Post-Market Surveillance: ai-act/monitoring-and-post-market-surveillance.md

  - Contact: contact.md
  - Bio: bio.md
